version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        APP_VERSION: "${APP_VERSION:-0.9.0}"
        GIT_COMMIT: "${GIT_COMMIT:-unknown}"
        BUILD_DATE: "${BUILD_DATE:-unknown}"
    container_name: harmonizer-backend
    ports:
      - "${BACKEND_PORT:-8001}:8001"
    volumes:
      - ${DATA_PATH:-./deploy/data}:/data
      - ${REPORT_PATH:-./deploy/reports}:/reports
      - ${LOG_PATH:-./deploy/logs}:/logs
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_VERSION=${APP_VERSION:-0.9.0}
      - GIT_COMMIT=${GIT_COMMIT:-unknown}
      - BUILD_DATE=${BUILD_DATE:-unknown}
      - DATA_PATH=/data
      - REPORT_PATH=/reports
      - LOG_PATH=/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, json; d=json.loads(urllib.request.urlopen('http://localhost:8001/health').read()); assert d['status']=='ok'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: harmonizer-frontend
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    environment:
      - BACKEND_URL=http://backend:8001
      - FRONTEND_PORT=3001
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3001/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
