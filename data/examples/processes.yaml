areas:
- id: definition_design
  name: Definition & Design
  description: Defines policies, frameworks, risk methodology, and BCM strategy. Sets the normative foundation for all InfoSec
    activities.
- id: check_execute
  name: Check & Execute
  description: Operational execution of security controls, incident handling, contract review, audits, and security operationalization.
- id: regulatory_compliance_office
  name: Regulatory Compliance Office
  description: Corporate governance coordination and regulatory compliance management for information security.
- id: support_office
  name: Support Office
  description: Internal support functions including backoffice, onboarding, technology projects, awareness, and division support.
streams:
- id: policies_processes
  area_id: definition_design
  name: Policies and Processes
  stream_type: governance_function
  description: Maintains the InfoSec policy framework, process definitions, and governance documentation across DE/AT.
  owner_role: Head of InfoSec Governance
  country_scope: BOTH
  tenant_scope: SEPARATE
  regulatory_context:
  - ISO 27001 Clause 5
  - NIS2
  notes: Policy content is largely harmonizable. Document management and approval workflows differ per ISMS tenant.
- id: it_bcm
  area_id: definition_design
  name: IT-BCM
  stream_type: process
  description: IT Business Continuity Management including BIA, BC strategy, BC plans, and testing.
  owner_role: BCM Manager
  country_scope: BOTH
  tenant_scope: SEPARATE
  regulatory_context:
  - ISO 22301
  - NIS2
  - DORA
  - BSI IT-Grundschutz (DE)
  notes: BIA methodology can be unified. BC plans are inherently local due to different IT landscapes.
- id: it_risk
  area_id: definition_design
  name: IT-Risk
  stream_type: process
  description: IT risk identification, assessment, treatment, and monitoring.
  owner_role: IT Risk Manager
  country_scope: BOTH
  tenant_scope: SEPARATE
  regulatory_context:
  - ISO 27005
  - ISO 31000
  - NIS2
  notes: Risk methodology and criteria can be harmonized. Risk registers are maintained per ISMS tenant.
- id: request_incident_mgmt
  area_id: check_execute
  name: Request & Incident Mgmt
  stream_type: process
  description: Handling of security requests and incidents from intake through resolution and lessons learned.
  owner_role: Head of Security Operations
  country_scope: BOTH
  tenant_scope: SEPARATE
  regulatory_context:
  - NIS2 Art. 23
  - DSGVO Art. 33/34
  - DSG (AT)
  notes: Request handling is harmonizable. Incident reporting to regulators differs (BSI vs. Austrian CERT/DSB).
- id: contract_mgmt
  area_id: check_execute
  name: Contract Mgmt
  stream_type: process
  description: Security review and requirements for third-party contracts, SLAs, and vendor agreements.
  owner_role: Contract Security Lead
  country_scope: BOTH
  tenant_scope: BOTH
  regulatory_context:
  - ISO 27001 A.15
  - NIS2 supply chain
  notes: Security requirements in contracts are largely identical. Legal review involves local legal departments.
- id: audits_execution_bps
  area_id: check_execute
  name: Audits execution & business partner security
  stream_type: process
  description: Execution of security audits and business partner security assessments.
  owner_role: Audit Execution Lead
  country_scope: BOTH
  tenant_scope: BOTH
  regulatory_context:
  - ISO 27001 Clause 9
  - NIS2
  notes: Audit methodology can be unified. Audit scheduling is local.
- id: operationalization
  area_id: check_execute
  name: Operationalization
  stream_type: capability_domain
  description: Translation of security requirements into operational controls and technical implementations.
  owner_role: Security Engineering Lead
  country_scope: BOTH
  tenant_scope: BOTH
  regulatory_context:
  - ISO 27001 Annex A
  notes: Shared tooling and platforms. Implementation patterns are reusable across DE/AT.
- id: corporate_governance
  area_id: regulatory_compliance_office
  name: Corporate Governance
  stream_type: program_domain
  description: Coordination of corporate governance requirements, board reporting, and regulatory change management.
  owner_role: Head of Regulatory Compliance
  country_scope: BOTH
  tenant_scope: SEPARATE
  regulatory_context:
  - NIS2
  - DORA
  - Corporate governance codes (DE/AT)
  notes: Reporting structure similar but legal entity requirements differ.
- id: is_gc_service
  area_id: regulatory_compliance_office
  name: Information Security Governance and Compliance
  stream_type: service_domain
  description: 'Provides governance and compliance services: compliance monitoring, control effectiveness assessment, regulatory
    mapping.'
  owner_role: IS Governance & Compliance Lead
  country_scope: BOTH
  tenant_scope: SEPARATE
  regulatory_context:
  - ISO 27001
  - NIS2
  - DSGVO/GDPR
  notes: Compliance framework is shared. Monitoring and evidence collection differs per ISMS tenant.
- id: backoffice
  area_id: support_office
  name: Backoffice
  stream_type: support_function
  description: 'Administrative support: budget, procurement, time tracking, travel, documentation.'
  owner_role: Backoffice Lead
  country_scope: BOTH
  tenant_scope: BOTH
  regulatory_context: []
  notes: Highly standardizable. Mostly administrative.
- id: on_offboarding
  area_id: support_office
  name: On & Offboarding
  stream_type: support_function
  description: Onboarding and offboarding of InfoSec team members including access provisioning, training, and knowledge transfer.
  owner_role: HR Liaison / Team Lead
  country_scope: BOTH
  tenant_scope: BOTH
  regulatory_context: []
  notes: Process is similar. HR systems and local labor law create minor differences.
- id: technology_projects_ai
  area_id: support_office
  name: Technology Projects & AI
  stream_type: capability_domain
  description: Management of internal technology projects and AI initiatives within InfoSec.
  owner_role: Technology Projects Lead
  country_scope: BOTH
  tenant_scope: BOTH
  regulatory_context:
  - EU AI Act
  notes: Fully shared capability. No country-specific differences.
- id: division_support
  area_id: support_office
  name: Division Support
  stream_type: support_function
  description: Dedicated InfoSec support for business divisions, including security consulting and project reviews.
  owner_role: Division Security Advisor
  country_scope: BOTH
  tenant_scope: SEPARATE
  regulatory_context: []
  notes: Service model is similar, but stakeholder landscapes differ between DE and AT.
- id: awareness_education
  area_id: support_office
  name: Awareness & Education
  stream_type: process
  description: Security awareness campaigns, training programs, phishing simulations, and education initiatives.
  owner_role: Awareness Program Lead
  country_scope: BOTH
  tenant_scope: BOTH
  regulatory_context:
  - ISO 27001 A.7.2.2
  - NIS2
  notes: Content and platforms are shared. Some localization needed.
- id: audit_organisation
  area_id: support_office
  name: Audit organisation
  stream_type: support_function
  description: Planning, scheduling, and coordination of audit activities.
  owner_role: Audit Coordination Lead
  country_scope: BOTH
  tenant_scope: BOTH
  regulatory_context:
  - ISO 27001 Clause 9
  notes: Audit planning can be centralized. Execution is per-entity.
