interfaces:
- id: iface-risk-to-incident
  source_process_id: sp-risk-identify
  target_process_id: sp-inc-intake
  interface_type: escalation
  description: Critical risks with imminent threat indicators are escalated as potential incidents.
  trigger: Risk with imminent exploitation likelihood identified
  exchanged_artifacts:
  - Risk assessment record
  - Affected asset details
  notes: null
- id: iface-incident-to-governance
  source_process_id: sp-inc-communication
  target_process_id: is_gc_service
  interface_type: notification
  description: Major incidents trigger compliance notification to IS Governance and Compliance.
  trigger: Incident severity 1 or 2 confirmed
  exchanged_artifacts:
  - Incident summary
  - Regulatory impact assessment
  notes: null
- id: iface-audit-to-risk
  source_process_id: sp-aud-reporting
  target_process_id: sp-risk-identify
  interface_type: data_flow
  description: Audit findings feed into risk identification as additional risk indicators.
  trigger: Audit completed with findings
  exchanged_artifacts:
  - Audit findings report
  - Non-conformity records
  notes: null
- id: iface-policy-to-awareness
  source_process_id: sp-pol-lifecycle
  target_process_id: sp-aware-campaign
  interface_type: trigger
  description: New or updated policies trigger awareness campaigns to communicate changes.
  trigger: Policy published or major revision approved
  exchanged_artifacts:
  - Policy document
  - Change summary
  notes: null
- id: iface-risk-to-corpgov
  source_process_id: sp-risk-monitor
  target_process_id: sp-cg-board-reporting
  interface_type: data_flow
  description: Aggregated risk reports are provided for board and management reporting.
  trigger: Quarterly risk reporting cycle
  exchanged_artifacts:
  - Risk dashboard
  - Top risks summary
  notes: null
- id: iface-contract-to-ops
  source_process_id: sp-con-review
  target_process_id: sp-ops-requirements
  interface_type: handover
  description: Contract security requirements are handed over for technical implementation.
  trigger: Contract with new security requirements signed
  exchanged_artifacts:
  - Security requirements list
  - Implementation timeline
  notes: null
- id: iface-audit-to-audorg
  source_process_id: sp-aud-planning
  target_process_id: sp-audorg-planning
  interface_type: data_flow
  description: Audit planning coordinates with audit organization for program alignment.
  trigger: Annual audit program cycle
  exchanged_artifacts:
  - Audit plan draft
  - Resource requirements
  notes: null
- id: iface-bps-to-contract
  source_process_id: sp-bps-assessment
  target_process_id: sp-con-assessment
  interface_type: data_flow
  description: Business partner security assessments inform vendor security evaluations.
  trigger: New business partner identified
  exchanged_artifacts:
  - Partner assessment results
  - Risk rating
  notes: null
- id: iface-incident-to-bcm
  source_process_id: sp-inc-triage
  target_process_id: sp-bcm-plan
  interface_type: escalation
  description: Severe incidents may trigger BC plan activation.
  trigger: Incident with potential service disruption (severity 1)
  exchanged_artifacts:
  - Incident ticket
  - Impact assessment
  notes: null
- id: iface-gc-to-contract
  source_process_id: sp-gc-compliance-monitoring
  target_process_id: sp-con-monitoring
  interface_type: notification
  description: Compliance findings trigger vendor contract security reviews.
  trigger: Vendor compliance gap identified
  exchanged_artifacts:
  - Compliance finding
  - Vendor reference
  notes: null
- id: iface-onb-to-backoffice
  source_process_id: sp-onb-onboarding
  target_process_id: backoffice
  interface_type: handover
  description: Onboarding triggers backoffice activities (equipment, access cards, budget allocation).
  trigger: New team member confirmed
  exchanged_artifacts:
  - Onboarding checklist
  - Resource requirements
  notes: null
- id: iface-tech-to-ops
  source_process_id: technology_projects_ai
  target_process_id: sp-ops-implementation
  interface_type: handover
  description: Technology projects hand over completed tools and platforms for operational use.
  trigger: Project deliverable ready for operations
  exchanged_artifacts:
  - Tool documentation
  - Deployment package
  notes: null
- id: iface-gc-to-policy
  source_process_id: sp-gc-regulatory-mapping
  target_process_id: sp-pol-lifecycle
  interface_type: trigger
  description: Regulatory gaps trigger policy updates or new policy creation.
  trigger: Gap identified in regulatory mapping
  exchanged_artifacts:
  - Gap analysis report
  - Required policy changes
  notes: null
- id: iface-incident-to-risk
  source_process_id: sp-inc-lessons
  target_process_id: sp-risk-identify
  interface_type: data_flow
  description: Lessons learned from incidents feed into risk identification.
  trigger: Post-incident review completed
  exchanged_artifacts:
  - Lessons learned report
  - New risk indicators
  notes: null
- id: iface-risk-to-ops
  source_process_id: sp-risk-treatment
  target_process_id: sp-ops-requirements
  interface_type: handover
  description: Risk treatment plans requiring technical controls are handed to operationalization.
  trigger: Risk treatment plan approved with technical measures
  exchanged_artifacts:
  - Treatment plan
  - Control specifications
  notes: null
- id: iface-aware-to-division
  source_process_id: sp-aware-campaign
  target_process_id: division_support
  interface_type: notification
  description: Awareness campaigns notify division support for local coordination.
  trigger: Campaign targeting specific division launched
  exchanged_artifacts:
  - Campaign plan
  - Division-specific content
  notes: null
