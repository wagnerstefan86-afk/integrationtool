# Example process definitions for two InfoSec streams:
# 1. Incident Management
# 2. Vulnerability Management
#
# Demonstrates: main processes, subprocesses, and cross-process interfaces.

main_processes:
  - id: stream-incident
    name: Incident Management
    description: >
      End-to-end handling of information security incidents, from detection
      through containment, eradication, recovery, and lessons learned.
    owner_role: Head of Security Operations
    country_scope: BOTH
    regulatory_context:
      - NIS2
      - DSGVO/GDPR
      - DORA (if financial sector entity)
    tenant_scope: SEPARATE
    notes: >
      Both DE and AT operate separate ISMS tenants. Incident records cannot
      be merged across tenants due to data residency requirements.

  - id: stream-vuln
    name: Vulnerability Management
    description: >
      Identification, assessment, prioritization, and remediation tracking
      of technical vulnerabilities across infrastructure and applications.
    owner_role: Head of Vulnerability Management
    country_scope: BOTH
    regulatory_context:
      - NIS2
      - ISO 27001 A.12.6
      - BSI IT-Grundschutz (DE only)
    tenant_scope: BOTH
    notes: >
      Vulnerability scanning tooling is shared. Remediation tracking may
      differ due to separate change management processes.

subprocesses:
  # --- Incident Management subprocesses ---
  - id: sp-inc-intake
    main_process_id: stream-incident
    name: Incident Intake
    description: Initial reception and logging of security events and incidents.
    purpose: Ensure all potential incidents are captured in a structured manner.
    inputs:
      - SIEM alerts
      - User reports
      - Automated detection feeds
    outputs:
      - Incident ticket (initial)
    roles:
      - SOC Analyst L1
      - Incident Coordinator
    tools:
      - SIEM
      - Ticketing System
    evidence:
      - Incident ticket with timestamp
      - Intake checklist
    country_scope: BOTH
    tenant_scope: SEPARATE
    regulatory_context:
      - NIS2 Art. 23 (reporting timelines)
    interfaces_with:
      - sp-inc-triage
    notes: null

  - id: sp-inc-triage
    main_process_id: stream-incident
    name: Incident Triage
    description: Assessment of severity, impact, and initial categorization.
    purpose: Determine priority and assign to appropriate response team.
    inputs:
      - Incident ticket (initial)
    outputs:
      - Prioritized incident ticket
      - Severity classification
    roles:
      - SOC Analyst L2
      - Incident Manager
    tools:
      - Ticketing System
      - Threat Intelligence Platform
    evidence:
      - Severity assessment record
      - Triage decision log
    country_scope: BOTH
    tenant_scope: SEPARATE
    regulatory_context:
      - NIS2
    interfaces_with:
      - sp-inc-communication
      - sp-vuln-assess
    notes: >
      Triage criteria are aligned across DE/AT, but escalation paths
      differ due to local management structures.

  - id: sp-inc-communication
    main_process_id: stream-incident
    name: Incident Communication
    description: Internal and external communication during and after incidents.
    purpose: Ensure timely notification of stakeholders, regulators, and affected parties.
    inputs:
      - Prioritized incident ticket
      - Severity classification
    outputs:
      - Stakeholder notifications
      - Regulatory reports
    roles:
      - Incident Manager
      - Communications Lead
      - DPO (if personal data involved)
    tools:
      - Communication templates
      - Email / Messaging platform
    evidence:
      - Notification log
      - Regulatory filing receipts
    country_scope: BOTH
    tenant_scope: SEPARATE
    regulatory_context:
      - NIS2 Art. 23
      - DSGVO Art. 33/34
      - DSG (AT) § 54
    interfaces_with: []
    notes: >
      DE reports to BSI, AT reports to national CERT and DSB.
      Templates differ. This subprocess has HIGH local necessity.

  # --- Vulnerability Management subprocesses ---
  - id: sp-vuln-scan
    main_process_id: stream-vuln
    name: Vulnerability Scanning
    description: Automated and manual scanning of infrastructure and applications.
    purpose: Discover known vulnerabilities across the IT landscape.
    inputs:
      - Asset inventory
      - Scan schedules
    outputs:
      - Raw scan results
    roles:
      - Vulnerability Analyst
      - Platform Engineer
    tools:
      - Vulnerability Scanner (shared)
      - Asset Management DB
    evidence:
      - Scan execution logs
      - Raw findings export
    country_scope: BOTH
    tenant_scope: BOTH
    regulatory_context:
      - ISO 27001 A.12.6
    interfaces_with:
      - sp-vuln-assess
    notes: Shared tooling and unified scan policies.

  - id: sp-vuln-assess
    main_process_id: stream-vuln
    name: Vulnerability Assessment
    description: Risk-based evaluation and prioritization of discovered vulnerabilities.
    purpose: Determine business risk and remediation priority.
    inputs:
      - Raw scan results
      - Threat intelligence
      - Asset criticality data
    outputs:
      - Prioritized vulnerability list
      - Risk ratings
    roles:
      - Vulnerability Analyst
      - Risk Analyst
    tools:
      - Vulnerability Management Platform
      - Risk Register
    evidence:
      - Risk assessment records
      - Prioritization matrix
    country_scope: BOTH
    tenant_scope: BOTH
    regulatory_context:
      - ISO 27001 A.12.6
      - BSI IT-Grundschutz (DE)
    interfaces_with:
      - sp-vuln-remediation
      - sp-inc-triage
    notes: >
      Assessment methodology is unified. BSI-specific scoring overlays
      apply only in DE context.

  - id: sp-vuln-remediation
    main_process_id: stream-vuln
    name: Vulnerability Remediation Tracking
    description: Tracking and verification of vulnerability fixes.
    purpose: Ensure vulnerabilities are remediated within defined SLAs.
    inputs:
      - Prioritized vulnerability list
    outputs:
      - Remediation status reports
      - SLA compliance metrics
    roles:
      - Vulnerability Analyst
      - System Owner
      - Change Manager
    tools:
      - Ticketing System
      - Change Management System
    evidence:
      - Remediation tickets
      - Re-scan verification reports
    country_scope: BOTH
    tenant_scope: SEPARATE
    regulatory_context:
      - ISO 27001
      - NIS2
    interfaces_with: []
    notes: >
      Change management processes are separate per country.
      SLA definitions are harmonized but enforcement is local.

interfaces:
  - id: iface-triage-to-vuln
    source_process_id: sp-inc-triage
    target_process_id: sp-vuln-assess
    interface_type: trigger
    description: >
      High-severity incidents may trigger emergency vulnerability assessment
      if the incident reveals a previously unknown vulnerability.
    trigger: Incident classified as severity 1 or 2 with vulnerability indicator
    exchanged_artifacts:
      - Incident ticket reference
      - Affected asset details
      - Preliminary vulnerability hypothesis
    notes: null

  - id: iface-vuln-to-incident
    source_process_id: sp-vuln-assess
    target_process_id: sp-inc-intake
    interface_type: escalation
    description: >
      Critical vulnerabilities under active exploitation are escalated
      as security incidents.
    trigger: CVSS >= 9.0 AND active exploitation confirmed
    exchanged_artifacts:
      - Vulnerability record
      - Exploitation evidence
      - Affected asset list
    notes: This is a cross-stream interface, not a parent-child relationship.
